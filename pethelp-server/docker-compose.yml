version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pethelp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pethelp_dev
      MYSQL_DATABASE: pethelp
      MYSQL_USER: pethelp
      MYSQL_PASSWORD: pethelp_dev
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pethelp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
